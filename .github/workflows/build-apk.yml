# Builds a debug APK on every push, so the APK comes from GitHub Actions
# instead of Android Studio.
#
# Why: the developer's laptop is a weak 4GB machine that cannot run
# Android Studio well. Push the code to GitHub, Actions builds it in the
# cloud, and the APK is downloaded from the run's Artifacts.
name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tether-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
